services:
  mariadb:
    image: mariadb:11
    environment:
      MARIADB_USER: spirit
      MARIADB_PASSWORD: spirit
      MARIADB_DATABASE: spirit_panel
      MARIADB_ROOT_PASSWORD: spirit_root
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mariadb_data:
  redis_data:
