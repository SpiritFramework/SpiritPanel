# Spirit Panel — http-context rate / connection zones.
# Install to: /etc/nginx/conf.d/spirit-panel-http.conf
# (Must live under http {}, not inside the site server block.)
#
# Keys use $binary_remote_addr. When Cloudflare proxies the panel, also install
# deploy/nginx/cloudflare-realip.conf so this is the visitor IP, not a CF edge.

limit_req_zone $binary_remote_addr zone=spirit_web:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=spirit_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=spirit_auth:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=spirit_remote:10m rate=80r/s;
limit_conn_zone $binary_remote_addr zone=spirit_conn:10m;
